<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood Badger Simulator</title>
<!-- Adapted from pimoroni/badgeware-wasm host/index.html (MIT). -->
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 1rem;
    font: 14px/1.5 system-ui, sans-serif; background: #e8e6e1; color: #2b2b2b;
    text-align: center;
  }
  h1 { font-size: 1rem; font-weight: 600; margin: 0; }
  #screen {
    width: 792px; max-width: calc(100vw - 32px); aspect-ratio: 264 / 176;
    background: #fff; border-radius: 6px; image-rendering: pixelated;
    box-shadow: 0 6px 30px rgba(0, 0, 0, .25);
  }
  kbd {
    background: #fff; border: 1px solid #b9b6ae; border-radius: 4px;
    padding: 1px 6px; font-family: ui-monospace, monospace; font-size: 12px;
  }
  #status { color: #66635c; min-height: 1.2em; }
  .hint { color: #66635c; }
</style>
</head>
<body>
  <h1>Mood Badger on the Badger 2350 simulator</h1>
  <canvas id="screen" width="792" height="528"></canvas>
  <div id="status">loading MicroPython...</div>
  <div class="hint">
    <kbd>&uarr;</kbd> previous mood &middot; <kbd>&darr;</kbd> next mood &middot;
    <kbd>A</kbd> previous set &middot; <kbd>C</kbd> next set &middot; <kbd>H</kbd> home
  </div>
  <div class="hint">Sleep, wake, refresh time and e-paper contrast are not simulated.</div>

<script type="module">
import { loadMicroPython } from "./micropython.mjs";

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
const status = document.getElementById("status");

const off = document.createElement("canvas");
const offctx = off.getContext("2d");

// Host contract: the simulator's ssd1680.update() passes its RGBA framebuffer.
globalThis.blitrgba = (addr, w, h) => {
  const heap = globalThis.Module.HEAPU8;
  const pixels = new Uint8ClampedArray(heap.subarray(addr, addr + w * h * 4));
  if (off.width !== w || off.height !== h) { off.width = w; off.height = h; }
  offctx.putImageData(new ImageData(pixels, w, h), 0, 0);
  ctx.drawImage(off, 0, 0, w, h, 0, 0, canvas.width, canvas.height);
};

// Host contract: buttons as an active-high bitmask; VBUS reads as connected
// and the active-low RTC alarm as idle.
const BUTTON = { HOME: 0x20, A: 0x10, B: 0x08, C: 0x04, UP: 0x02, DOWN: 0x01 };
const KEYS = {
  "a": BUTTON.A, "b": BUTTON.B, "c": BUTTON.C,
  "ArrowUp": BUTTON.UP, "ArrowDown": BUTTON.DOWN, "h": BUTTON.HOME,
};
const VBUS_DETECT = 12;
const RTC_ALARM = 13;
let buttons = 0;
globalThis.sim_buttons = () => buttons;
globalThis.sim_gpio_get = (gpio) => (gpio === VBUS_DETECT || gpio === RTC_ALARM ? 1 : null);
addEventListener("keydown", (e) => {
  const b = KEYS[e.key];
  if (b !== undefined) { buttons |= b; e.preventDefault(); }
});
addEventListener("keyup", (e) => {
  const b = KEYS[e.key];
  if (b !== undefined) { buttons &= ~b; e.preventDefault(); }
});

const mp = await loadMicroPython({
  heapsize: 8 * 1024 * 1024,
  stdout: (line) => console.log(line),
  stderr: (line) => console.error(line),
});

status.textContent = "loading files...";
const manifest = await (await fetch("fs/manifest.json", { cache: "no-store" })).json();
for (const [devicePath, local] of manifest) {
  const bytes = new Uint8Array(await (await fetch("fs/" + local, { cache: "no-store" })).arrayBuffer());
  mp.FS.mkdirTree(devicePath.slice(0, devicePath.lastIndexOf("/")));
  mp.FS.writeFile(devicePath, bytes);
}

status.textContent = "running";
try {
  await mp.runPythonAsync(await (await fetch("boot.py", { cache: "no-store" })).text());
  status.textContent = "stopped";
} catch (e) {
  status.textContent = "stopped: " + e;
  console.error(e);
}
</script>
</body>
</html>
